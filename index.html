<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daoudi Print | مطبعة الداودي</title>
    <style>
        :root {
            --twitter-blue: #1d9bf0;
            --twitter-bg: #ffffff;
            --twitter-border: #eff3f4;
            --twitter-text: #0f1419;
            --twitter-gray: #536471;
            --instagram-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f7f9f9; 
            color: var(--twitter-text); 
            direction: rtl;
        }

        /* حاوية التطبيق المركزية - تشبه واجهة الهاتف */
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--twitter-bg);
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            border-left: 1px solid var(--twitter-border);
            border-right: 1px solid var(--twitter-border);
            padding-bottom: 80px;
        }

        /* بروفايل المطبعة على طريقة إنستغرام وتويتر */
        .profile-header {
            border-bottom: 1px solid var(--twitter-border);
            padding: 20px 15px;
            text-align: right;
            background: #ffffff;
        }
        
        .profile-top {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5rem;
            border: 2px solid #fff;
            box-shadow: 0 0 0 2px #1d9bf0;
            flex-shrink: 0;
        }

        .profile-info h1 {
            margin: 0;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        /* شارة التوثيق الزرقاء */
        .verified-badge {
            color: var(--twitter-blue);
            font-size: 1.2rem;
        }

        .profile-info p {
            margin: 5px 0 0 0;
            color: var(--twitter-gray);
            font-size: 0.95rem;
        }

        .profile-bio {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--twitter-text);
            margin-top: 10px;
        }

        /* أزرار التنقل والتبويبات السريعة */
        .nav-tabs {
            display: flex;
            border-bottom: 1px solid var(--twitter-border);
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 15px 0;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--twitter-gray);
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
            position: relative;
        }

        .tab-btn.active {
            color: var(--twitter-text);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            right: 20%;
            height: 4px;
            background-color: var(--twitter-blue);
            border-radius: 2px;
        }

        /* محتوى التايملاين والمنشورات */
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }

        /* تصميم منشور إنستغرام/تويتر الاحترافي */
        .post-card {
            border-bottom: 1px solid var(--twitter-border);
            background: #ffffff;
            padding: 15px;
            text-align: right;
        }

        .post-author {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .author-mini-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .author-names {
            display: flex;
            flex-direction: column;
        }

        .author-name {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .author-handle {
            color: var(--twitter-gray);
            font-size: 0.85rem;
        }

        .post-text {
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .post-image-wrapper {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--twitter-border);
            margin-bottom: 12px;
        }

        .post-card img {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: cover;
            display: block;
        }

        .post-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
        }

        .post-price {
            font-weight: bold;
            color: #f43f5e;
            font-size: 1rem;
            background: #fff1f2;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .post-actions-icons {
            color: var(--twitter-gray);
            font-size: 0.9rem;
        }

        /* زر الواتساب العائم والسريع */
        .btn-whatsapp-fixed {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25D366;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(37,211,102,0.3);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* المساعد الذكي السفلي المدمج */
        .ai-launcher-fixed {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: var(--twitter-blue);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(29,155,240,0.3);
            z-index: 999;
        }

        .ai-window {
            position: fixed;
            bottom: 80px;
            left: 20px;
            right: 20px;
            max-width: 360px;
            height: 400px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
            display: none;
            flex-direction: column;
            z-index: 1000;
            border: 1px solid var(--twitter-border);
            overflow: hidden;
        }

        .ai-header {
            background: var(--twitter-text);
            color: white;
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        
        .ai-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f7f9f9;
        }

        .msg { margin-bottom: 12px; padding: 10px; border-radius: 12px; max-width: 85%; font-size: 0.9rem; line-height: 1.4; text-align: right; }
        .msg.bot { background: #eff3f4; color: var(--twitter-text); }
        .msg.user { background: var(--twitter-blue); color: white; margin-right: auto; text-align: left; }
        .ai-input-area { display: flex; padding: 10px; border-top: 1px solid var(--twitter-border); background: #fff; }
        .ai-input-area input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 20px; outline: none; padding-right: 15px; }
        .ai-input-area button { background: var(--twitter-blue); color: white; border: none; padding: 0 15px; margin-right: 5px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- جزء البرفضايل العلوي التويتري -->
        <div class="profile-header">
            <div class="profile-top">
                <div class="profile-avatar">DP</div>
                <div class="profile-info">
                    <h1>مطبعة الداودي <span class="verified-badge">✓</span></h1>
                    <p>@daoudiprint2026</p>
                </div>
            </div>
            <div class="profile-bio">
                ✨ جودة واحترافية في عالم الطباعة الرقمية والإعلانية بمراكش.<br>
                💼 مطبوعات تجارية • لافتات محلات • علب وتغليف فاخر.
            </div>
        </div>

        <!-- التبويبات على شكل أقسام تويتر النشطة -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="openTab('commercial')">مطبوعات تجارية</button>
            <button class="tab-btn" onclick="openTab('signage')">لوحات ولافتات</button>
            <button class="tab-btn" onclick="openTab('packaging')">علب وتغليف</button>
        </div>

        <!-- 1. قسم المطبوعات التجارية كمنشورات متتالية -->
        <div id="commercial" class="tab-content active">
            <!-- منشور 1 -->
            <div class="post-card">
                <div class="post-author">
